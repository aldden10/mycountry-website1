name: Import website video
on:
  push:
    paths:
      - .github/workflows/import-website-video.yml
permissions:
  contents: write
jobs:
  import-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify source MP4
        run: |
          mkdir -p media
          curl --fail --location --retry 3 --retry-delay 2 'https://videos.pexels.com/video-files/20316963/20316963-hd_1920_1080_60fps.mp4' -o media/20316963-hd_1920_1080_60fps.mp4
          echo '05e6a285f14a3822568e94bb2d507af8e28a3a4fffa1407a547b16582c5bbd51  media/20316963-hd_1920_1080_60fps.mp4' | sha256sum -c -
      - name: Add verified video to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/20316963-hd_1920_1080_60fps.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'Add self-hosted Syria video'
            git push origin HEAD:main
          fi
